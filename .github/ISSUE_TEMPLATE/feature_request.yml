name: Feature request
description: Suggest a change or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in a laboratory, not only the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: regulation
    attributes:
      label: Regulatory or SOP background (optional)
      description: Which guideline, SOP or audit finding motivates the change? Cite the clause if you can.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
