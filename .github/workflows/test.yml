name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          # the versions in requirements.txt are verified on 3.9; add other versions only after they pass
          python-version: "3.9"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -s tests
